name: mehdi_iptv
description: SkyPro — a Flutter IPTV client for live TV, VOD, and series with Xtream Codes / M3U support, device activation, EPG, favorites, and multi-platform playback.

publish_to: 'none'

version: 1.4.3+44

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.8.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  responsive_sizer: ^3.3.1
  awesome_snackbar_content: ^0.1.5
  google_fonts: ^6.2.1
  flutter_rating_bar: ^4.0.1
  readmore: ^3.0.0
  loading_animation_widget: ^1.3.0
  device_info_plus: ^13.0.0
  package_info_plus: ^10.2.1
  vpn_connection_detector: ^2.0.2

  #Logic
  flutter_bloc: ^9.0.0
  get: ^4.7.2
  intl: ^0.20.2
  get_storage: ^2.1.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  volume_controller: ^3.3.1
  screen_brightness: ^2.1.1
  wakelock_plus: ^1.4.0
  qr_flutter: ^4.1.0
  # v7+: Apple Vision on iOS (no MLKit). v6 excludes arm64 simulator and breaks Codemagic debug/simulator builds.
  mobile_scanner: ^7.4.0

  #M3U - fork 16kb: مكتبة بديلة قد تعمل على المحاكي/نوكس
  flutter_vlc_player_16kb:
    path: packages/flutter_vlc_player_16kb
  pod_player: ^0.2.2
  # Forked locally: Media3 ExoPlayer rebuilt for IPTV (see packages/better_player_plus).
  better_player_plus:
    path: packages/better_player_plus

  #Http
  dio: ^5.8.0+1
  http: ^1.2.2
  connectivity_plus: ^7.0.0
  onesignal_flutter: ^5.6.8
  crypto: ^3.0.7
  dart_jsonwebtoken: ^2.14.2
  flutter_lucide: ^1.11.0
  path_provider: ^2.1.5
  file_picker: ^12.0.0
  in_app_update: ^4.2.5
  google_mobile_ads: ^9.1.0
  lottie: ^3.3.3

  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/images/skypro_logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/skypro_logo.png"
  web:
    generate: true
    image_path: "assets/images/skypro_logo.png"
  image_path: "assets/images/skypro_logo.png"
  remove_alpha_ios: true

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/avatars/
    - assets/images/smart_tv_nav/
    - assets/images/no_poster.png
    - assets/animations/
    - assets/themes/netflix_red/bg_main.png
    - assets/themes/ramadan_gold/bg_main.png
    - assets/themes/sport/bg_main.png
    - assets/themes/hallowen/bg_main.png
    - assets/themes/purple/bg_main.png

