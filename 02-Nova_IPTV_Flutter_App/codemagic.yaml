# Optional Codemagic YAML workflow for iOS Debug.
# If you already use the Codemagic Workflow Editor (UI), you can keep it —
# just make sure the iOS build script does NOT use --simulator.
#
# Recommended UI / script build command:
#   flutter build ipa --debug
#
# Or for a quick device build without export:
#   flutter build ios --debug --no-codesign
workflows:
  ios-debug:
    name: iOS Debug
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: development
        bundle_identifier: nova.iptv.player
    scripts:
      - name: Set up code signing profiles
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update
      - name: Build debug IPA (real device — not simulator)
        script: |
          flutter build ipa --debug \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
