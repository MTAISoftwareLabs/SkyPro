name: Build Universal Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '02-Nova_IPTV_Flutter_App/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Dependencies
        working-directory: 02-Nova_IPTV_Flutter_App
        run: |
          flutter pub get

      - name: Build Universal Release APK
        working-directory: 02-Nova_IPTV_Flutter_App
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyPro-Universal-Release-APK
          path: 02-Nova_IPTV_Flutter_App/build/app/outputs/flutter-apk/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.3-latest
          name: "SkyPro Universal Release v1.4.3"
          body: |
            ### SkyPro Universal Release Build
            - Pure Username & Password login system
            - Optimized for Android TV remote control navigation
            - Pointing to `https://admin.skypro-app.com` backend
            - Supports both ARM 32-bit (armeabi-v7a) and ARM 64-bit (arm64-v8a)
          files: 02-Nova_IPTV_Flutter_App/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
